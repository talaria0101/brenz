[package]
name = "brenz"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.88"
chrono = "0.4.42"
clap = { version = "4.5.51", features = ["derive"] }
log = "0.4.27"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tokio = { version = "1.45.1", features = ["full"] }
tower-lsp-server = "0.22.1"
tracing-subscriber = "0.3.19"
tree-sitter = "0.25.8"
tree-sitter-gsc = { path = "../parser" }
