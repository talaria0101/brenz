[workspace]
members = [".", "parser"]

[package]
name = "brenz"
version = "0.1.0"
edition = "2024"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
async-trait = "0.1.92"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
log = "0.4.34"
nucleo = "0.5.0"
rayon = "1.12"
ron = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }
tokio = { version = "1.53.1", features = ["full"] }
tower-lsp-server = "0.22.1"
tracing-subscriber = "0.3.23"
tree-sitter = "0.27.0"
tree-sitter-gsc = { path = "parser" }
